<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사부작스쿨 — 무한의 계단 테스트 버전 (Before / After)</title>
<style>
  :root {
    --bg: #130d2e;
    --surface: #211850;
    --surface-2: #2d2268;
    --border: rgba(255,255,255,0.14);
    --text: #f5f3ff;
    --muted: #c2b9ea;
    --accent: #ffd23f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    padding: 20px 16px 36px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: 24px; font-weight: 900; color: var(--accent); }
  .sub { margin: 0; font-size: 14px; color: var(--muted); }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 18px;
  }
  .group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.04);
    padding: 5px 8px;
    border-radius: 10px;
  }
  .glab { font-size: 12px; font-weight: 800; color: var(--muted); margin-right: 4px; }
  button {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 11px;
    border-radius: 9px;
    cursor: pointer;
    transition: transform .1s, background .15s;
  }
  button:hover { background: #3b2d86; }
  button:active { transform: translateY(1px); }
  button.fx { background: #1c6e2f; border-color: rgba(255,255,255,0.22); }
  button.fx:hover { background: #176929; }
  button.on, button.fx.on { background: var(--accent); color: #1b1340; border-color: #fff6cc; }
  .boards {
    display: grid;
    grid-template-columns: repeat(2, minmax(280px, 360px));
    justify-content: center;
    gap: 24px;
  }
  @media (max-width: 760px) {
    .boards { grid-template-columns: minmax(280px, 360px); }
  }
  .board { display: flex; flex-direction: column; gap: 8px; }
  .board-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
  .board-head h2 { margin: 0; font-size: 16px; font-weight: 800; }
  .tag { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,0.12); color: var(--muted); }
  .tag.new { background: rgba(63,208,74,0.22); color: #8ef576; }
  canvas {
    width: 100%;
    height: auto;
    aspect-ratio: 360 / 640;
    display: block;
    border-radius: 18px;
    border: 2px solid var(--border);
    box-shadow: 0 14px 36px rgba(0,0,0,0.45);
    background: #1b1340;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>무한의 계단 테스트 버전 (Before / After)</h1>
    <p class="sub">고도별 배경 변화, 입체 계단, 모자/스카프 등반가, 마일스톤 배너를 비교·조작해 보세요.</p>
  </header>

  <div class="toolbar" role="region" aria-label="미리보기 제어">
    <div class="group" id="g-floor">
      <span class="glab">층수 배경</span>
      <button type="button" data-f="5" class="on">5층 (낮)</button>
      <button type="button" data-f="40">40층 (노을)</button>
      <button type="button" data-f="85">85층 (밤하늘)</button>
      <button type="button" data-f="130">130층 (우주)</button>
    </div>
    <div class="group">
      <span class="glab">등반 테스트</span>
      <button type="button" class="fx on" id="btn-auto">자동 등반 ON</button>
      <button type="button" class="fx" id="btn-step">한 칸 오르기</button>
      <button type="button" class="fx" id="btn-wrong">오답 흔들림</button>
      <button type="button" class="fx" id="btn-banner">마일스톤 배너</button>
    </div>
  </div>

  <div class="boards">
    <section class="board">
      <div class="board-head">
        <h2>Before (현재 게임)</h2>
        <span class="tag">단색 벽·사각 인형</span>
      </div>
      <canvas id="cv-before" width="360" height="640"></canvas>
    </section>

    <section class="board">
      <div class="board-head">
        <h2>After (테스트 버전)</h2>
        <span class="tag new">신규 등반가·고도 배경</span>
      </div>
      <canvas id="cv-after" width="360" height="640"></canvas>
    </section>
  </div>
</div>

<script type="module">
import { createStairs } from './js/games/stairs/logic.js';
import {
  drawStairsBackground, drawStairBlock, drawClimber, drawTapHint,
} from './js/games/stairs/render.js';
import {
  drawBadgePill, drawBannerCard, createParticlePool,
} from './js/games/common/canvas-fx.js';

const W = 360, H = 640;
const STEP_DX = 40, STEP_DY = 30, BLOCK_W = 56, BLOCK_H = 16, HOP_H = 24;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

const cvBefore = document.getElementById('cv-before');
const cvAfter = document.getElementById('cv-after');
for (const cv of [cvBefore, cvAfter]) { cv.width = W * dpr; cv.height = H * dpr; }
const gOld = cvBefore.getContext('2d');
const gNew = cvAfter.getContext('2d');

let seeded = 7;
const rng = () => ((seeded = (seeded * 1664525 + 1013904223) >>> 0) / 4294967296);
const st = createStairs(rng);
const xs = [0];
function wx(i) {
  while (xs.length <= i) {
    const k = xs.length;
    xs.push(xs[k - 1] + (st.steps[k - 1] === 'L' ? -STEP_DX : STEP_DX));
  }
  return xs[i];
}
const wy = (i) => -i * STEP_DY;

let baseFloor = 5;
let vi = 0, camX = 0, camY = 0, facing = 1, time = 0;
let auto = true, autoTimer = 0, shake = 0, wrongFlash = 0, landT = 1;
let banner = { text: '25층 돌파!', sub: '계속 올라가요!', t: 0.4, dur: 2.2 };
const pool = createParticlePool(60);

function jumpToFloor(target) {
  baseFloor = target;
  while (st.pos < target) {
    const d = st.expected();
    facing = d === 'L' ? -1 : 1;
    st.tap(d);
  }
  vi = st.pos;
  camX = wx(st.pos);
  camY = wy(st.pos);
}

function posAt(v) {
  const a = Math.floor(v);
  const f = v - a;
  const x = wx(a) + (wx(a + 1) - wx(a)) * f;
  const y = wy(a) + (wy(a + 1) - wy(a)) * f;
  return { x, y: y - Math.sin(Math.PI * f) * HOP_H };
}

function stepOne() {
  const d = st.expected();
  facing = d === 'L' ? -1 : 1;
  st.tap(d);
  if (st.score > 0 && st.score % 10 === 0) {
    banner = { text: `${st.score}층 돌파!`, sub: '멋진 리듬이에요!', t: 0, dur: 2.2 };
  }
}

function drawOld(g) {
  g.save();
  if (shake > 0) g.translate(Math.sin(time * 70) * 6 * (shake / 0.35), 0);
  g.fillStyle = '#f3e9de';
  g.fillRect(0, 0, W, H);
  const py = camY * 0.5, rowH = 64, colW = 72;
  const off = ((py % rowH) + rowH) % rowH;
  const offX = (((-camX * 0.5) % colW) + colW) % colW;
  for (let r = -1; r < H / rowH + 2; r++) {
    const y = r * rowH + off;
    const idx = Math.round((y - py) / rowH);
    g.fillStyle = idx % 2 ? '#eddfd1' : '#f1e5d8';
    g.fillRect(0, y, W, rowH - 4);
    for (let c = -1; c < W / colW + 2; c++) {
      const x = c * colW + offX + 14;
      g.fillStyle = '#cdbdad'; g.fillRect(x - 3, y + 7, 40, 38);
      g.fillStyle = '#dce8ee'; g.fillRect(x, y + 10, 34, 32);
    }
  }
  g.fillStyle = 'rgba(255,250,244,0.28)'; g.fillRect(0, 0, W, H);

  const ci = Math.floor(vi);
  const colors = ['#ff6b6b', '#4dabf7', '#51cf66', '#ffd43b', '#b197fc'];
  for (let i = Math.max(0, ci - 12); i <= ci + 18; i++) {
    const sx = W / 2 + wx(i) - camX;
    const sy = H * 0.68 + wy(i) - camY;
    g.fillStyle = colors[i % colors.length];
    g.fillRect(sx - BLOCK_W / 2, sy, BLOCK_W, BLOCK_H);
    g.strokeStyle = 'rgba(40,25,15,0.75)'; g.lineWidth = 2;
    g.strokeRect(sx - BLOCK_W / 2, sy, BLOCK_W, BLOCK_H);
  }
  const p = posAt(vi);
  const px = W / 2 + p.x - camX, py2 = H * 0.68 + p.y - camY;
  g.save(); g.translate(px, py2);
  g.fillStyle = '#3b5bdb'; g.fillRect(-9, -18, 18, 14);
  g.fillStyle = '#ffe0bd'; g.beginPath(); g.arc(0, -27, 10, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#e8590c'; g.beginPath(); g.arc(0, -30, 10, Math.PI, 0); g.fill();
  g.fillStyle = '#222'; g.fillRect(facing * 4 - 1.5, -28, 3, 4);
  g.restore();
  g.restore();

  // old pill
  g.save();
  g.fillStyle = 'rgba(27,19,64,0.88)'; g.strokeStyle = '#fff'; g.lineWidth = 3;
  g.beginPath(); g.roundRect(W - 92, 16, 80, 44, 22); g.fill(); g.stroke();
  g.fillStyle = '#ffd23f'; g.font = '900 28px sans-serif'; g.textAlign = 'right'; g.textBaseline = 'middle';
  g.fillText(`${st.score}층`, W - 26, 39);
  g.restore();
}

function drawNew(g) {
  g.save();
  if (shake > 0) g.translate(Math.sin(time * 70) * 6 * (shake / 0.35), 0);
  drawStairsBackground(g, W, H, camX, camY, vi, time);

  const ci = Math.floor(vi);
  for (let i = Math.max(0, ci - 12); i <= ci + 18; i++) {
    const sx = W / 2 + wx(i) - camX;
    if (sx < -BLOCK_W || sx > W + BLOCK_W) continue;
    const sy = H * 0.68 + wy(i) - camY;
    drawStairBlock(g, i, sx, sy, BLOCK_W, BLOCK_H, i === st.pos, i === st.pos ? wrongFlash : 0);
  }
  if (st.pos === 0) {
    drawTapHint(g, W / 2 + wx(0) - camX, H * 0.68 + wy(0) - camY, st.expected(), time);
  }

  const p = posAt(vi);
  const f = vi - Math.floor(vi);
  const air = Math.sin(Math.PI * f);
  const b = landT > 1 ? 0 : Math.exp(-9 * landT) * Math.cos(32 * landT);
  const sq = (1 + 0.16 * air) * (1 - 0.25 * b);
  const scx = (1 - 0.1 * air) * (1 + 0.25 * b);
  drawClimber(g, {
    x: W / 2 + p.x - camX,
    y: H * 0.68 + p.y - camY,
    facing,
    sq,
    scx,
    air,
    time,
    wrong: wrongFlash > 0,
    fast: st.pos - vi > 0.6 || auto,
  });

  pool.draw(g, (y) => H * 0.68 + y - camY);
  g.restore();

  drawBadgePill(g, W - 10, 16, `${st.score}층`, `최고 ${Math.max(st.score, 120)}층`);
  if (banner) drawBannerCard(g, W, 86, banner);
}

let last = 0;
function loop(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
  last = now;
  time += dt;
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (wrongFlash > 0) wrongFlash = Math.max(0, wrongFlash - dt);
  if (landT < 10) landT += dt;
  if (banner) { banner.t += dt; if (banner.t >= banner.dur) banner = null; }

  if (auto) {
    autoTimer += dt;
    if (autoTimer >= 0.36) { autoTimer = 0; stepOne(); }
  }
  if (vi < st.pos) {
    const prev = vi;
    vi = Math.min(st.pos, vi + 9 * dt * Math.max(1, st.pos - vi));
    const n = Math.floor(vi + 1e-9);
    if (n > Math.floor(prev + 1e-9)) {
      landT = 0;
      pool.emitDust(wx(n), wy(n), 5);
      if (n % 10 === 0) pool.emitSparks(wx(n), wy(n) - 10, '#ffd23f', 8);
    }
  }
  pool.step(dt);
  const p = posAt(vi);
  const k = 1 - Math.pow(0.002, dt);
  camX += (p.x - camX) * k;
  camY += (p.y - camY) * k;

  gOld.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawOld(gOld);
  gNew.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawNew(gNew);
  requestAnimationFrame(loop);
}

jumpToFloor(5);
requestAnimationFrame(loop);

document.getElementById('g-floor').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-f]');
  if (!b) return;
  const f = Number(b.dataset.f);
  if (f < st.pos) {
    // reset stairs from 0 cleanly when jumping back down
    seeded = 7;
    const fresh = createStairs(rng);
    st.steps.splice(0, st.steps.length, ...fresh.steps);
    st.pos = 0; st.score = 0; xs.splice(1);
  }
  jumpToFloor(f);
  document.querySelectorAll('#g-floor button').forEach((x) => x.classList.toggle('on', x === b));
});

document.getElementById('btn-auto').addEventListener('click', (e) => {
  auto = !auto;
  e.target.classList.toggle('on', auto);
  e.target.textContent = auto ? '자동 등반 ON' : '자동 등반 OFF';
});
document.getElementById('btn-step').addEventListener('click', () => { stepOne(); });
document.getElementById('btn-wrong').addEventListener('click', () => {
  shake = 0.35;
  wrongFlash = 0.45;
  pool.emitChips(wx(st.pos), wy(st.pos), '#ff4d6d', 6);
});
document.getElementById('btn-banner').addEventListener('click', () => {
  banner = { text: `${Math.max(10, Math.floor(st.score / 10) * 10)}층 돌파!`, sub: '계속 올라가요!', t: 0, dur: 2.2 };
});
</script>
</body>
</html>
